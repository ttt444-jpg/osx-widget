name: OSXWidgets
options:
  bundleIdPrefix: de.thomasdobler
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # DEVELOPMENT_TEAM: XXXXXXXXXX   # oder in Xcode unter Signing setzen
    # Config-App und Widgets teilen ihre Einstellungen über die App Group
    # <TeamID>.de.thomasdobler.osxwidgets.shared (Team-ID kommt automatisch aus dem Signing).

targets:
  # Die eine Config-App: Seitenleiste mit einer Einstellungsseite pro Widget.
  OSXWidgets:
    type: application
    platform: macOS
    sources: [ConfigApp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.thomasdobler.osxwidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OSX Widgets
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: ConfigApp/Info.plist
      properties:
        AppGroupID: $(TeamIdentifierPrefix)de.thomasdobler.osxwidgets.shared
    entitlements:
      path: ConfigApp/ConfigApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)de.thomasdobler.osxwidgets.shared
    dependencies:
      - target: OSXWidgetsExtension

  # Eine Widget-Extension mit allen Widgets (Widgets/WidgetsBundle.swift).
  OSXWidgetsExtension:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.thomasdobler.osxwidgets.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OSX Widgets
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(TeamIdentifierPrefix)de.thomasdobler.osxwidgets.shared
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)de.thomasdobler.osxwidgets.shared
