name: ETFWatch
options:
  bundleIdPrefix: de.thomasdobler
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # DEVELOPMENT_TEAM: XXXXXXXXXX   # oder in Xcode unter Signing setzen
    # App und Widget teilen die Watchlist über die App Group
    # <TeamID>.de.thomasdobler.depotkurse (Team-ID kommt automatisch aus dem Signing).

targets:
  ETFWatch:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.thomasdobler.etfwatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Depot-Kurse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    info:
      path: App/Info.plist
      properties:
        AppGroupID: $(TeamIdentifierPrefix)de.thomasdobler.depotkurse
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)de.thomasdobler.depotkurse
    dependencies:
      - target: ETFWatchWidget

  ETFWatchWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.thomasdobler.etfwatch.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Depot-Kurse
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(TeamIdentifierPrefix)de.thomasdobler.depotkurse
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)de.thomasdobler.depotkurse
